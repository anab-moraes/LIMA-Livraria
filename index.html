<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria LIMA</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- Link fonte -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inria+Serif:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="barra-navegacao">
        <div class="home-parte-1">
            <img class="logo" src="./img/img-perfil/logo-cort.png" alt="livro">
            <a href="#">Biblioteca</a>
        </div>

        <div class="home-parte-2">
            <ul>
                <li>
                    <img src="./img/img-home/Home.png" alt="">
                    <a href="./pages/home.html">Início</a>
                </li>
                <li>
                    <img src="./img/img-home/livro.png" alt="">
                    <a href="">Livros</a>
                </li>
                <li>
                    <img src="./img/img-home/User.png" alt="">
                    <a href="">Autores</a>
                </li>
                <li>
                    <img src="./img/img-home/Tags.png" alt="">
                    <a href="">Categorias</a>
                </li>
                <li>
                    <img src="./img/img-home/Timer.png" alt="">
                    <a href="">Empréstimos</a>
                </li>
            </ul>
        </div>
        <div class="home-parte-3">
            <img src="./img/img-home/User2.png" alt="#">
            <a href="./pages/user.html">Usuário</a>
            <img class="mais" src="img/img-home/traço.png" alt="">
        </div>
    </header>
    <main>
        <img class="img-main" src="./img/img-home/imgHome.png" alt="">
        <div class="texto-home">
            <div class="bem-vindo">
                <img class="traco" src="./img/img-home/traco-bem-vindo.png" alt="">
                <h1>BEM - VINDO À BIBLIOTECA</h1>
            </div>

            <h2>Mais do que livros, <br>é um mundo de <span class="lerolero">histórias.</span> </h2>
            <p>Explore nosso acervo, descubra novos autores <br> e encontre o próximo livro que vai te inspirar.</p>
            <span class="button"><a href="./pages/home.html">Explorar acervo <span class="espaco">------</span> <img src="./img/img-home/seta.png"
                        alt=""></a></span>
        </div>
    </main>

</html>
